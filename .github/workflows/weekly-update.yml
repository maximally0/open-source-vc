name: Weekly Update

# The semi-automated weekly cycle.
#
# Discovery and metadata refresh are automated. Curation is not: this workflow
# never writes to curation.yaml. It refreshes verified metadata, regenerates the
# derived pages, and opens a pull request for a human to review and merge.
#
# If the run finds nothing worth reporting, it opens nothing.

on:
  schedule:
    # Mondays 06:00 UTC.
    - cron: "0 6 * * 1"
  workflow_dispatch:
    inputs:
      with_releases:
        description: "Also fetch latest releases (slower, more API calls)"
        type: boolean
        default: false

permissions:
  contents: write
  pull-requests: write
  issues: write

concurrency:
  group: weekly-update
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: pip install pyyaml

      - name: Refresh verified metadata
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if [ "${{ inputs.with_releases }}" = "true" ]; then
            python scripts/update.py --with-releases
          else
            python scripts/update.py
          fi

      - name: Regenerate directory pages
        run: python scripts/generate_index.py

      - name: Validate (offline)
        run: python scripts/verify.py --offline

      - name: Detect changes
        id: diff
        run: |
          # metadata/snapshot.json always carries a fresh generated_at timestamp, so a
          # naive diff would open a pull request every single week even when nothing
          # drifted. Separate routine timestamp churn from substantive change, because
          # the two deserve different treatment: refresh silently, escalate loudly.
          echo "Working tree:"
          git status --porcelain

          OTHER=$(git status --porcelain | grep -v '^ M metadata/snapshot.json' || true)
          SNAP=$(git diff -U0 metadata/snapshot.json \
                   | grep -E '^[+-]' \
                   | grep -vE '^(\+\+\+|---)' \
                   | grep -v '"generated_at"' || true)

          if [ -z "$OTHER" ] && [ -z "$SNAP" ]; then
            echo "substantive=false" >> "$GITHUB_OUTPUT"
            echo "No drift. Committing the refreshed timestamp only."
          else
            echo "substantive=true" >> "$GITHUB_OUTPUT"
            echo "Drift detected:"
            [ -n "$SNAP" ] && echo "$SNAP" | head -40
            [ -n "$OTHER" ] && echo "$OTHER"
          fi

      - name: Commit routine refresh to main
        # Nothing drifted, so there is nothing for a human to decide. Keep the
        # committed snapshot current rather than accumulating review requests nobody
        # needs to read.
        if: steps.diff.outputs.substantive == 'false'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "Nothing staged; no commit needed."
          else
            git commit -m "chore(weekly): refresh metadata timestamps [skip ci]"
            git push origin HEAD:main
            echo "Committed routine metadata refresh to main."
          fi

      - name: Open pull request for review
        id: propose
        if: steps.diff.outputs.substantive == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          DATE=$(date -u +%Y-%m-%d)
          BRANCH="automation/weekly-${DATE}"
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout -b "$BRANCH"
          git add -A
          git commit -m "chore(weekly): refresh metadata ${DATE}"
          git push --set-upstream origin "$BRANCH"
          echo "branch=$BRANCH" >> "$GITHUB_OUTPUT"

          QUEUE="research/review-queue-${DATE}.md"
          BODY=$(mktemp)
          {
            echo "Automated weekly refresh — **metadata only**."
            echo
            echo "Produced by \`scripts/update.py\`. This refreshes verified GitHub metadata,"
            echo "regenerates the derived pages, and records anything needing a human decision."
            echo
            echo "It does **not** add, remove, or re-classify any repository. That is deliberate:"
            echo "discovery is automated, curation is human."
            echo
            if [ -f "$QUEUE" ]; then
              echo "### Review queue"
              echo
              cat "$QUEUE"
            else
              echo "No drift detected against the curated list this week."
            fi
            echo
            echo "---"
            echo
            echo "**Branch:** \`$BRANCH\`"
            echo
            echo "**To merge:** confirm the regenerated pages look right, then squash-merge."
            echo "**To act on the queue:** edit \`curation.yaml\`, run \`python scripts/generate_index.py\`, commit."
          } > "$BODY"

          # PR creation can be blocked by a repository setting
          # ("Allow GitHub Actions to create and approve pull requests"). That is a
          # configuration choice, not a broken workflow, so warn and continue rather
          # than failing the run. The branch is already pushed and the issue still
          # opens, so nothing is lost and the queue is never silently dropped.
          if gh pr create \
               --title "chore(weekly): metadata refresh ${DATE}" \
               --body-file "$BODY" \
               --label automated --label weekly \
               --base main --head "$BRANCH" > pr-url.txt 2> pr-err.txt; then
            echo "pr_url=$(cat pr-url.txt)" >> "$GITHUB_OUTPUT"
            echo "Opened pull request: $(cat pr-url.txt)"
          else
            echo "pr_url=" >> "$GITHUB_OUTPUT"
            echo "::warning::Could not open a pull request automatically. The branch is pushed; open it from the repository."
            sed 's/^/  /' pr-err.txt || true
          fi

          # The issue API works with the default token regardless of that setting, so
          # this is the channel that must not fail.
          if gh issue create \
               --title "Weekly review queue — ${DATE}" \
               --body-file "$BODY" \
               --label weekly --label curation > issue-url.txt 2> issue-err.txt; then
            echo "Opened issue: $(cat issue-url.txt)"
          else
            gh issue create --title "Weekly review queue — ${DATE}" --body-file "$BODY"
          fi

      - name: Summary
        run: |
          {
            echo "### Weekly update"
            echo
            echo "- Drift detected: ${{ steps.diff.outputs.substantive }}"
            if [ -n "${{ steps.propose.outputs.branch }}" ]; then
              echo "- Branch: \`${{ steps.propose.outputs.branch }}\`"
            fi
            if [ -n "${{ steps.propose.outputs.pr_url }}" ]; then
              echo "- Pull request: ${{ steps.propose.outputs.pr_url }}"
            else
              echo "- Pull request: not opened automatically (see warnings above)"
            fi
            echo
            echo "Curated repositories in snapshot:"
            python -c "import json;print(json.load(open('metadata/snapshot.json'))['repo_count'])"
          } >> "$GITHUB_STEP_SUMMARY"
