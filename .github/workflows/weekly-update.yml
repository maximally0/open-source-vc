name: Weekly Update

# The semi-automated weekly cycle.
#
# Discovery and metadata refresh are automated. Curation is not: this workflow
# never writes to curation.yaml. It refreshes verified metadata, regenerates the
# derived pages, and opens a pull request for a human to review and merge.
#
# If the run finds nothing worth reporting, it opens nothing.

on:
  schedule:
    # Mondays 06:00 UTC.
    - cron: "0 6 * * 1"
  workflow_dispatch:
    inputs:
      with_releases:
        description: "Also fetch latest releases (slower, more API calls)"
        type: boolean
        default: false

permissions:
  contents: write
  pull-requests: write
  issues: write

concurrency:
  group: weekly-update
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: pip install pyyaml

      - name: Refresh verified metadata
        # --with-releases always, so the shape of the committed snapshot is identical
        # between local runs and CI. Mixing the two made an otherwise clean run look
        # like drift, because one snapshot had a latest_releases field and the other
        # did not.
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python scripts/update.py --with-releases

      - name: Regenerate directory pages
        run: python scripts/generate_index.py

      - name: Validate (offline)
        run: python scripts/verify.py --offline

      - name: Detect changes
        id: diff
        run: |
          # scripts/update.py decides what deserves a human's attention. Star counts and
          # new releases move every week and nothing follows from them; an archived
          # project, a licence change, or a vanished repository is exactly what the
          # weekly cycle exists to surface. Reading that decision is more reliable than
          # diffing a large JSON blob in bash, and it means a routine week stays quiet.
          python - <<'PY' >> "$GITHUB_OUTPUT"
          import json, pathlib
          p = pathlib.Path("metadata/last-refresh.json")
          if not p.exists():
              print("substantive=false")
          else:
              d = json.loads(p.read_text(encoding="utf-8"))
              print("substantive=" + ("true" if d.get("substantive") else "false"))
          PY

          echo "--- last-refresh.json ---"
          cat metadata/last-refresh.json || true
          echo "--- git status ---"
          git status --porcelain

      - name: Commit routine refresh to main
        # Nothing drifted, so there is nothing for a human to decide. Keep the
        # committed snapshot current rather than accumulating review requests nobody
        # needs to read.
        if: steps.diff.outputs.substantive == 'false'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "Nothing staged; no commit needed."
            exit 0
          fi
          git commit -q -m "chore(weekly): refresh metadata [skip ci]"

          # main can move while this job is running: a human pushing, another
          # workflow, a merge. That is a race, not a failure, so fold onto whatever
          # landed and retry rather than dying on a rejected push.
          for attempt in 1 2 3; do
            if git push -q origin HEAD:main; then
              echo "Committed routine metadata refresh to main (attempt ${attempt})."
              exit 0
            fi
            echo "Push rejected on attempt ${attempt}. Rebasing onto origin/main and retrying."
            git fetch -q origin main
            if ! git rebase -q origin/main; then
              # A conflict here can only be in generated metadata, and this job's copy
              # was read from the API moments ago, so ours is the newer truth.
              echo "Conflict in generated files; keeping this run's freshly fetched data."
              git checkout --theirs -- metadata/snapshot.json metadata/repositories.json \
                                      metadata/repositories.yaml metadata/last-refresh.json \
                                      metadata/schema.json 2>/dev/null || true
              git add -A
              GIT_EDITOR=true git rebase --continue || { git rebase --abort || true; echo "::error::Could not rebase generated metadata."; exit 1; }
            fi
            sleep 5
          done
          echo "::error::Could not push the routine metadata refresh after 3 attempts."
          exit 1

      - name: Open pull request for review
        id: propose
        if: steps.diff.outputs.substantive == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          DATE=$(date -u +%Y-%m-%d)
          BRANCH="automation/weekly-${DATE}"
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout -b "$BRANCH"
          git add -A
          git commit -m "chore(weekly): refresh metadata ${DATE}"
          git push --set-upstream origin "$BRANCH"
          echo "branch=$BRANCH" >> "$GITHUB_OUTPUT"

          QUEUE="research/review-queue-${DATE}.md"
          BODY=$(mktemp)
          {
            echo "Automated weekly refresh — **metadata only**."
            echo
            echo "Produced by \`scripts/update.py\`. This refreshes verified GitHub metadata,"
            echo "regenerates the derived pages, and records anything needing a human decision."
            echo
            echo "It does **not** add, remove, or re-classify any repository. That is deliberate:"
            echo "discovery is automated, curation is human."
            echo
            if [ -f "$QUEUE" ]; then
              echo "### Review queue"
              echo
              cat "$QUEUE"
            else
              echo "No drift detected against the curated list this week."
            fi
            echo
            echo "---"
            echo
            echo "**Branch:** \`$BRANCH\`"
            echo
            echo "**To merge:** confirm the regenerated pages look right, then squash-merge."
            echo "**To act on the queue:** edit \`curation.yaml\`, run \`python scripts/generate_index.py\`, commit."
          } > "$BODY"

          # PR creation can be blocked by a repository setting
          # ("Allow GitHub Actions to create and approve pull requests"). That is a
          # configuration choice, not a broken workflow, so warn and continue rather
          # than failing the run. The branch is already pushed and the issue still
          # opens, so nothing is lost and the queue is never silently dropped.
          if gh pr create \
               --title "chore(weekly): metadata refresh ${DATE}" \
               --body-file "$BODY" \
               --label automated --label weekly \
               --base main --head "$BRANCH" > pr-url.txt 2> pr-err.txt; then
            echo "pr_url=$(cat pr-url.txt)" >> "$GITHUB_OUTPUT"
            echo "Opened pull request: $(cat pr-url.txt)"
          else
            echo "pr_url=" >> "$GITHUB_OUTPUT"
            echo "::warning::Could not open a pull request automatically. The branch is pushed; open it from the repository."
            sed 's/^/  /' pr-err.txt || true
          fi

          # The issue API works with the default token regardless of that setting, so
          # this is the channel that must not fail.
          if gh issue create \
               --title "Weekly review queue — ${DATE}" \
               --body-file "$BODY" \
               --label weekly --label curation > issue-url.txt 2> issue-err.txt; then
            echo "Opened issue: $(cat issue-url.txt)"
          else
            gh issue create --title "Weekly review queue — ${DATE}" --body-file "$BODY"
          fi

      - name: Summary
        run: |
          {
            echo "### Weekly update"
            echo
            echo "- Drift detected: ${{ steps.diff.outputs.substantive }}"
            if [ -n "${{ steps.propose.outputs.branch }}" ]; then
              echo "- Branch: \`${{ steps.propose.outputs.branch }}\`"
            fi
            if [ -n "${{ steps.propose.outputs.pr_url }}" ]; then
              echo "- Pull request: ${{ steps.propose.outputs.pr_url }}"
            else
              echo "- Pull request: not opened automatically (see warnings above)"
            fi
            echo
            echo "Curated repositories in snapshot:"
            python -c "import json;print(json.load(open('metadata/snapshot.json'))['repo_count'])"
          } >> "$GITHUB_STEP_SUMMARY"
