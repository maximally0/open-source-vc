  - name: freelawproject/courtlistener
    category: legal
    tier: essential
    kind: software
    display_name: CourtListener
    tagline: A searchable archive of US court data.
    vc_use_case: >
      Litigation is a diligence question almost nobody checks properly: is the target or its
      founders party to a lawsuit, has a competitor sued them, is there an IP dispute
      waiting. Court records are public but scattered across thousands of county and federal
      systems. This puts them in one searchable place.
    why_interesting: >
      Maintained by the Free Law Project, which has been doing this for over a decade with
      bulk data and an API rather than a website you have to scrape. It is the single
      biggest open legal dataset available.
    good_for:
      - Legal due diligence
      - Litigation checks
      - Founder background
    limitations: >
      US courts only, and coverage varies by jurisdiction and court level, with some records
      incomplete. The licence is not a standard SPDX identifier, so check terms before
      building a service on the data.
    vc_native: false
    vc_relevance: adaptable
    ai: false
    self_hostable: true
    verification: true
    best_for: Litigation checks

  - name: freelawproject/juriscraper
    category: legal
    tier: experimental
    kind: framework
    display_name: Juriscraper
    tagline: Scrapers for US court websites.
    vc_use_case: >
      The collection layer behind CourtListener, usable directly when a diligence needs
      filings from a specific court that is not well covered. Relevant for jurisdiction-
      specific litigation research.
    why_interesting: >
      Court websites are hostile to automation and this maintains scrapers for hundreds of
      them, including the parsing of what comes back. That maintenance is the expensive part.
    good_for:
      - Litigation research
      - Legal data collection
    limitations: >
      Per-court scrapers break as courts change their sites, so expect gaps and breakage.
      US only.
    vc_native: false
    vc_relevance: infrastructure
    ai: false
    self_hostable: true
    verification: true
    best_for: Litigation research

  - name: Zackriya-Solutions/meetily
    category: relationship-intelligence
    tier: recommended
    kind: software
    display_name: Meetily
    tagline: A self-hosted AI meeting assistant.
    vc_use_case: >
      The meeting-intelligence layer a fund actually needs: transcribe founder calls and
      partner meetings locally, produce notes, and keep the record without sending audio to
      a cloud service. Investment discussions involve unannounced deals and other people's
      confidential information.
    why_interesting: >
      It runs locally with fast local models, which is the requirement that rules out the
      commercial meeting assistants for most funds. Speaker separation and summaries without
      a per-seat subscription.
    good_for:
      - Meeting records
      - Call transcripts
      - IC preparation
    limitations: >
      Local transcription needs decent hardware, and accuracy trails a hosted service.
      Recording calls still requires consent and disclosure in many jurisdictions.
    vc_native: false
    vc_relevance: adaptable
    ai: true
    self_hostable: true
    verification: true
    best_for: Meeting records

  - name: pingcap/ossinsight
    category: company-discovery
    tier: recommended
    kind: software
    display_name: OSS Insight
    tagline: Analytics over the public GitHub event stream.
    vc_use_case: >
      Technical traction without asking the company: how fast is a repository growing, who
      contributes, where are the contributors located, is momentum rising or flattening.
      For a developer-tools or open-source business this is the most objective signal
      available before revenue.
    why_interesting: >
      It analyses the full public GitHub event history rather than current star counts, so
      you can see trajectory and contributor geography. That is the difference between a
      vanity metric and a diligence input.
    good_for:
      - Technical due diligence
      - GitHub signals
      - Developer market research
    limitations: >
      GitHub only, so it says nothing about closed-source businesses, and popularity is not
      revenue. The hosted instance is the primary product.
    vc_native: false
    vc_relevance: adaptable
    ai: false
    self_hostable: true
    verification: true
    best_for: GitHub signals

  - name: star-history/star-history
    category: company-discovery
    tier: recommended
    kind: software
    display_name: Star History
    tagline: Plot repository star growth over time.
    vc_use_case: >
      The fast sanity check on a developer-tool claim. A repo with a vertical star curve
      followed by a plateau tells a different story from one climbing steadily, and a
      sudden spike often means a launch or a Hacker News moment rather than adoption.
    why_interesting: >
      It is a small tool that answers a question people routinely get wrong, and the curve
      is usually more informative than the total.
    good_for:
      - Technical due diligence
      - GitHub signals
      - Competitor tracking
    limitations: >
      Stars measure attention, not usage or revenue, and spikes are frequently launch-driven.
      Read it as one input.
    vc_native: false
    vc_relevance: adaptable
    ai: false
    self_hostable: true
    verification: true
    best_for: GitHub signals

  - name: firecrawl/fire-enrich
    category: company-discovery
    tier: experimental
    kind: software
    display_name: Fire Enrich
    tagline: Turn an email or domain into company data.
    vc_use_case: >
      The enrichment step in a sourcing pipeline: given a list of addresses from a community,
      an event, or a newsletter, resolve them to companies with industry and size. That is
      how a list of names becomes a target list.
    why_interesting: >
      Enrichment is normally a paid API and this does the job with a crawler and a model, so
      a fund can run it over its own lists without per-record pricing.
    good_for:
      - Company enrichment
      - Inbound triage
      - Sourcing pipelines
    limitations: >
      Enrichment quality depends on what is publicly crawlable, so results need checking
      before they enter a CRM. Early project.
    vc_native: false
    vc_relevance: adaptable
    ai: true
    self_hostable: true
    verification: true
    best_for: Company enrichment

