  - name: sophymarine/openregistry
    category: company-discovery
    tier: experimental
    kind: software
    display_name: OpenRegistry
    tagline: Company registry data direct from official sources.
    vc_use_case: >
      Incorporation and corporate-structure checking: is the entity real, where is it
      registered, what is its status. A surprising number of pitches get the legal entity
      wrong, and the registry is the authoritative answer.
    why_interesting: >
      One of very few open attempts at official registry data, and it exposes it to agents
