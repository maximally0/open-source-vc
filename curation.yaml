# Curation layer for the Open Source VC directory.
#
# This file is the human judgement in the project. Everything here is editorial:
# which category a project belongs in, how good it is, what a VC would use it for,
# and what is wrong with it.
#
# It is deliberately separate from metadata/snapshot.json, which holds facts read
# from the GitHub API (stars, forks, licence, dates, archived status). Nothing in
# this file overrides a verified fact; the two are merged by
# scripts/generate_index.py.
#
# Rules for editing:
#   1. Never invent a number. Counts come from the API, not from here.
#   2. Never guess a licence. If the repository has none, that fact is reported.
#   3. A vc_use_case must name the task and the person doing it. "Useful for
#      investors" is not a use case and will be rewritten or rejected.
#   4. Every entry needs limitations. A tool with no stated downsides has not been
#      understood yet.
#   5. verified: true means the upstream repository was opened and inspected.
#
# Schema: metadata/schema.json. Regenerate with `python scripts/generate_index.py`.

meta:
  version: 2
  schema: metadata/schema.json
  note: >
    Fields marked editorial are judgement. Fields sourced from GitHub are facts
    recorded in metadata/snapshot.json with a timestamp.

repos:
  # =========================================================================
  # Founder & Talent Discovery
  # =========================================================================
  - name: sherlock-project/sherlock
    category: founder-discovery
    tier: essential
    kind: software
    display_name: Sherlock
    tagline: Find an account on 400+ sites from a username alone.
    vc_use_case: >
      When a founder's name is common or their LinkedIn is thin, an analyst runs the
      handle they use elsewhere through Sherlock to see where else that handle exists.
      That confirms the person matches the deck and often turns up public work that
      never made it onto a resume.
    why_interesting: >
      It needs no API keys and no accounts. Results are links you can open and read
      yourself, which matters when the output is going into an investment memo rather
      than a hobby project.
    good_for:
      - Founder background checks
      - Identity resolution
      - Reference hunting
    limitations: >
      A hit is a username match, not proof of identity. Coverage shifts as sites change
      their responses, and some sites rate-limit or block outright.
    dependencies: Python 3.9+, no API keys required
    vc_native: false
    vc_relevance: adaptable
    ai: false
    self_hostable: true
    starter: true
    starter_order: 3
    hidden_gem: false
    verification: true
    best_for: Founder background checks

  - name: soxoj/maigret
    category: founder-discovery
    tier: recommended
    kind: software
    display_name: Maigret
    tagline: Build a dossier on a person from one username.
    vc_use_case: >
      Produces a report across 3,000+ sites from a single handle, including account
      metadata and extracted profile fields where the site exposes them. Useful when
      checking whether a claimed technical founder or advisor has any public footprint
      at all, which is often the fastest way to spot an inflated bio.
    why_interesting: >
      It scores confidence per hit and can emit a PDF or HTML report, so findings can be
      filed as evidence instead of pasted as loose links.
    good_for:
      - Founder vetting
      - Advisor credential checks
      - Due diligence support
    limitations: >
      Reports are only as good as what is public, and common usernames produce false
      positives. Treat every result as a lead to confirm.
    vc_native: false
    vc_relevance: adaptable
    ai: false
    self_hostable: true
    verification: true
    best_for: Founder vetting

  - name: lissy93/web-check
    category: founder-discovery
    tier: essential
    kind: software
    display_name: Web-Check
    tagline: A full external read of any website from a single URL.
    vc_use_case: >
      Point it at a target company's domain and get its hosting, DNS and mail records,
      TLS configuration, exposed headers, and third-party services. That is the
      ten-minute technical screen an associate runs before a first call, and it usually
      surfaces something the deck did not mention.
    why_interesting: >
      It reads what the site publicly publishes rather than guessing, runs as a single
      page, and needs no setup. Findings are the raw records, so they are checkable.
    good_for:
      - Technical screening
      - Competitor stack research
      - Pre-meeting preparation
    limitations: >
      Only shows what is externally visible. A clean report is not a clean bill of
      health, and a missing finding is not evidence of absence.
    vc_native: false
    vc_relevance: adaptable
    ai: false
    self_hostable: true
    starter: true
    starter_order: 4
    hidden_gem: false
    verification: true
    best_for: Technical screening

  - name: speedyapply/JobSpy
    category: founder-discovery
    tier: recommended
    kind: software
    display_name: JobSpy
    tagline: Job postings from five boards into one dataframe.
    vc_use_case: >
      A fund watching a sector can track which startups are hiring, for which functions,
      and how fast, without buying a labour-market dataset. Headcount movement by team
      is one of the few signals a private company cannot easily dress up.
    why_interesting: >
      It covers LinkedIn, Indeed, Glassdoor, Google, and ZipRecruiter behind one
      interface and returns a typed frame, so a hiring signal can be built in an
      afternoon rather than a data-engineering project.
    good_for:
      - Sourcing signals
      - Market research
      - Portfolio monitoring
    limitations: >
      Upstream layout changes break scrapers without warning, and collecting from these
      boards may breach their terms of service. Check that before running it at scale.
    vc_native: false
    vc_relevance: adaptable
    ai: false
    self_hostable: true
    hidden_gem: true
    verification: true
    best_for: Hiring signals

  - name: lockfale/OSINT-Framework
    category: founder-discovery
    tier: recommended
    kind: software
    display_name: OSINT Framework
    tagline: A map of where to look, organised by what you already have.
    vc_use_case: >
      When a background check feels incomplete, this is the checklist that tells you
      what other public sources exist for the thing you hold: a username, an email, a
      domain, a phone number. Analysts new to research use it to learn the terrain once.
    why_interesting: >
      It is a working web interface over a maintained index, and it groups tools by
      category rather than pretending every link is equally worth opening.
    good_for:
      - Research training
      - Background checks
      - Source discovery
    limitations: >
      Many listed links are stale or lead to commercial products. Nothing here checks
      the links for you.
    vc_native: false
    vc_relevance: adaptable
    ai: false
    self_hostable: true
    verification: true
    best_for: Source discovery

  - name: laramies/theHarvester
    category: founder-discovery
    tier: recommended
    kind: software
    display_name: theHarvester
    tagline: Emails, subdomains, and names tied to a domain.
    vc_use_case: >
      A first pass on a company you have no relationship with: it collects public
      emails, hostnames, and employee names from search engines and certificate logs.
      Useful for working out how large a team really is and who to approach.
    why_interesting: >
      Certificate transparency and search-engine sources are queried together, so a
      company's real infrastructure footprint shows up even when the marketing site
      hides it.
    good_for:
      - Company reconnaissance
      - Contact discovery
      - Team sizing
    limitations: >
      No licence file is present in the repository, so redistribution and some
      commercial uses are unclear. Check with counsel before shipping anything built
      on it, and note that a missing licence is reported here rather than assumed away.
    vc_native: false
    vc_relevance: adaptable
    ai: false
    self_hostable: true
    verification: true
    best_for: Company reconnaissance

  - name: joeyism/linkedin_scraper
    category: founder-discovery
    tier: experimental
    kind: software
    display_name: linkedin_scraper
    tagline: Pull LinkedIn profiles and company pages into structured data.
    vc_use_case: >
      Build a sourcing database from profile and company pages, including positions and
      tenure. Funds use it to answer questions like how long a founding team has worked
      together and who reported to whom.
    why_interesting: >
      Runs in a real browser session and returns typed fields rather than screenshots,
      which is what makes the output usable in a database instead of a folder of saves.
    good_for:
      - Sourcing databases
      - Team research
    limitations: >
      LinkedIn's terms prohibit automated collection and accounts get restricted for it.
      Use only where you accept that risk; prefer licensed data for anything systematic.
    vc_native: false
    vc_relevance: adaptable
    ai: false
    self_hostable: true
    hidden_gem: false
    verification: true
    best_for: Sourcing databases

  - name: instaloader/instaloader
    category: founder-discovery
    tier: experimental
    kind: software
    display_name: Instaloader
    tagline: Download public Instagram posts and their metadata.
    vc_use_case: >
      For consumer and creator-facing companies, a founder's or brand's Instagram is
      part of the evidence trail: posting cadence, engagement, and how long they have
      been at it. This gathers that into files an analyst can review.
    why_interesting: >
      It captures metadata alongside media and can resume interrupted runs, which makes
      it practical for watching an account over time rather than taking one snapshot.
    good_for:
      - Founder research
      - Consumer brand research
    limitations: >
      Instagram actively blocks bulk collection, so expect throttling and account
      losses. Public content only, and the platform's terms still apply to how you use it.
    vc_native: false
    vc_relevance: adaptable
    ai: false
    self_hostable: true
    verification: true
    best_for: Consumer founder research

  # =========================================================================
  # Company Discovery & Deal Sourcing
  # =========================================================================
  - name: yc-oss/api
    category: company-discovery
    tier: essential
    kind: dataset
    display_name: YC Open API
    tagline: Y Combinator's own company and founder data, as an API.
    vc_use_case: >
      Every YC company with its batch, industry, team size, status, and founders, plus a
      website field. Analysts use it to build a sector map of a batch cohort, spot which
      companies have already shut down, and check what a founder did before YC.
    why_interesting: >
      It is maintained by the accelerator itself rather than scraped, so the batch and
      status fields are authoritative. Being a plain API, it drops into a script instead
      of a spreadsheet.
    good_for:
      - Cohort analysis
      - Sector mapping
      - Founder research
    limitations: >
      Covers YC companies only, so it is a slice of the market and a biased one. No
      funding rounds or valuations. There is no licence file, so confirm terms before
      redistributing the data.
    vc_native: true
    vc_relevance: native
    ai: false
    self_hostable: true
    starter: true
    starter_order: 2
    hidden_gem: false
    verification: true
    best_for: Cohort analysis

  - name: KonstantinMB/exploreyc
    category: company-discovery
    tier: recommended
    kind: software
    display_name: ExploreYC
    tagline: Browse the YC portfolio as a searchable, filterable site.
    vc_use_case: >
      A fast way to walk the YC universe by batch, industry, and hiring status when you
      want to see a sector rather than query an API. Useful for an associate building a
      market map for a thesis in an afternoon.
    why_interesting: >
      It layers an idea validator, a hiring board, and a crude success signal over the
      same dataset, which shows how far a public company graph can be stretched.
    good_for:
      - Market mapping
      - Thesis building
      - Sourcing
    limitations: >
      Small project with a narrow dataset behind it, and the predictive features are
      demonstration-grade rather than something to make decisions on.
    vc_native: true
    vc_relevance: native
    ai: true
    self_hostable: true
    hidden_gem: true
    verification: true
    best_for: Market mapping

  - name: guy-hartstein/company-research-agent
    category: company-discovery
    tier: recommended
    kind: software
    display_name: Company Research Agent
    tagline: An agent that researches a company and returns a structured brief.
    vc_use_case: >
      Feed it a company name and get back a summary of what the company does, its
      market, competitors, and recent news, with sources. This is the first-pass brief
      an analyst writes before a screening call, assembled in minutes.
    why_interesting: >
      It is built on a graph of research steps rather than one long prompt, so the
      output shows the retrieval path. That makes the result easier to spot-check than a
      single model answer.
    good_for:
      - Screening preparation
      - Competitive research
      - Market research
    limitations: >
      Requires a search API key and an LLM provider, so it costs money to run. Output
      quality tracks the underlying search results, and citations need checking.
    vc_native: false
    vc_relevance: adaptable
    ai: true
    self_hostable: true
    hidden_gem: true
    verification: true
    best_for: Screening preparation

  - name: dedupeio/dedupe
    category: company-discovery
    tier: recommended
    kind: software
    display_name: dedupe
    tagline: Record linkage and entity resolution for messy company lists.
    vc_use_case: >
      Two funds merge sourcing lists, or a CRM export meets a scraped dataset, and
      someone has to decide which rows describe the same company before anything can be
      counted. This does that match at a scale no one does by hand.
    why_interesting: >
      You label a handful of pairs and it learns the rest, which handles the cases exact
      string matching misses: "Acme AI Inc" against "Acme.ai", or a legal entity against
      its trading name.
    good_for:
      - CRM hygiene
      - List merging
      - Data quality
    limitations: >
      Needs labelled training pairs to perform well, and gets slow on millions of rows
      without tuning. Python only.
    vc_native: false
    vc_relevance: adaptable
    ai: false
    self_hostable: true
    hidden_gem: true
    verification: true
    best_for: CRM hygiene

  - name: mnemox-ai/idea-reality-mcp
    category: company-discovery
    tier: experimental
    kind: software
    display_name: Idea Reality
    tagline: Checks whether a product idea already exists, across five sources.
    vc_use_case: >
      Before a first call with a startup claiming a new category, run the premise
      through this to see what already exists on GitHub, Hacker News, npm, PyPI, and
      Product Hunt. It is a five-minute sanity check on how novel the claim really is.
    why_interesting: >
      It queries the places where working software shows up first, rather than press
      coverage, so it catches prior art that predates the funding announcements.
    good_for:
      - Novelty checks
      - Competitive research
      - First-call preparation
    limitations: >
      It reports existence, not quality or traction. A hit means something similar is
      public, which is not the same as a competitor, and a miss proves nothing.
    vc_native: false
    vc_relevance: adaptable
    ai: true
    self_hostable: true
    hidden_gem: true
    verification: true
    best_for: Novelty checks

  - name: iloveitaly/openbook
    category: company-discovery
    tier: experimental
    kind: dataset
    display_name: OpenBook
    tagline: An open investor and venture database.
    vc_use_case: >
      A community attempt at the investor-and-fund graph that normally sits behind a
      PitchBook licence: who invests at which stage, in which sectors, and alongside
      whom. Useful for building a target list of funds rather than companies.
    why_interesting: >
      It is the only serious open attempt at this dataset that this research turned up,
      which makes it worth watching even at its current size.
    good_for:
      - Fund targeting
      - Syndicate research
      - Fundraising research
    limitations: >
      Early and thin compared with commercial alternatives, and coverage of any given
      sector is likely incomplete. Verify entries upstream before relying on them.
    vc_native: true
    vc_relevance: native
    ai: false
    self_hostable: true
    hidden_gem: true
    verification: true
    best_for: Fund targeting

  - name: Nimbus318/miracle-plus-gallery
    category: company-discovery
    tier: experimental
    kind: dataset
    display_name: MiraclePlus Gallery
    tagline: Five years of MiraclePlus (formerly YC China) demo-day companies.
    vc_use_case: >
      A structured look at the portfolio of the accelerator that ran YC's China
      programme, including sector tags, school networks, and people links. For anyone
      investing in or researching Chinese AI, robotics, or cross-border companies this
      is otherwise hard to assemble.
    why_interesting: >
      The data is in Chinese and nowhere else in a structured form. It is a reminder
      that a large part of the world's startup activity is invisible to English-language
      searches.
    good_for:
      - China market research
      - Sector mapping
      - Network analysis
    limitations: >
      Interface and data are Chinese-language, coverage stops at the programme's end, and
      there is no licence file. Confirm terms before reuse.
    vc_native: true
    vc_relevance: native
    ai: false
    self_hostable: true
    hidden_gem: true
    verification: true
    best_for: China market research

  # =========================================================================
  # Deal Sourcing & Pipeline
  # =========================================================================
  - name: 0xnyn/subsignal
    category: deal-sourcing
    tier: experimental
    kind: software
    display_name: subsignal
    tagline: Deal-flow monitoring built for funds.
    vc_use_case: >
      Watches company and competitor signals so an analyst does not have to check the
      same sites weekly: new products, pricing changes, launches. The intended output is
      a shortlist of companies whose activity changed, which is the raw material of
      outbound sourcing.
    why_interesting: >
      It is one of very few projects written for investors rather than adapted from a
      general monitoring tool, so the event model matches how a fund actually tracks a
      watchlist.
    good_for:
      - Outbound sourcing
      - Watchlist monitoring
      - Competitive intelligence
    limitations: >
      Early-stage with a small maintainer base, and no licence file is present, so terms
      for reuse are unclear. Expect to write your own connectors.
    vc_native: true
    vc_relevance: native
    ai: false
    self_hostable: true
    hidden_gem: true
    verification: true
    best_for: Watchlist monitoring

  - name: kklounge/execsum-deal-brief
    category: deal-sourcing
    tier: experimental
    kind: software
    display_name: ExecSum Deal Brief
    tagline: A daily deal-flow brief with a ranked top three.
    vc_use_case: >
      Assembles a morning brief that ranks the day's deals and attaches expert and
      banking commentary. The use case is a partner's inbox at 7am: what moved, and what
      deserves a look, without anyone compiling it.
    why_interesting: >
      It ranks rather than lists, which is the part most monitoring tools skip. Ranking
      is where the judgement goes, so it is worth reading the code to see how it decides.
    good_for:
      - Daily briefings
      - Deal-flow triage
      - Partner communication
    limitations: >
      Depends on external news and data sources that may change or require keys, and the
      ranking logic is simple enough to disagree with. Small project.
    vc_native: true
    vc_relevance: native
    ai: true
    self_hostable: true
    hidden_gem: true
    verification: true
    best_for: Deal-flow triage

  - name: nocodb/nocodb
    category: deal-sourcing
    tier: essential
    kind: software
    display_name: NocoDB
    tagline: Airtable-style database over Postgres, MySQL, or SQLite.
    vc_use_case: >
      The deals pipeline most small funds actually need: stages, owners, next actions,
      and notes, as a grid anyone on the team can edit, sitting on a real database you
      control. It replaces a spreadsheet that has grown past what a spreadsheet can hold.
    why_interesting: >
      It puts a collaborative grid on top of your existing database instead of creating
      another silo, so the pipeline stays queryable by the tools you already run.
    good_for:
      - Deal pipelines
      - Portfolio tracking
      - Internal tools
    limitations: >
      Advanced features sit behind a commercial tier, and the licence is not a standard
      open-source one. Large bases need real database tuning.
    vc_native: false
    vc_relevance: adaptable
    ai: false
    self_hostable: true
    starter: true
    starter_order: 6
    hidden_gem: false
    verification: true
    best_for: Deal pipelines

  - name: huginn/huginn
    category: deal-sourcing
    tier: recommended
    kind: software
    display_name: Huginn
    tagline: Agents that watch the web and act when something changes.
    vc_use_case: >
      Set up watchers on the sites a thesis depends on: a competitor's pricing page, a
      job board for a specific role, a regulator's filing list. When something changes,
      Huginn notifies or triggers a downstream action, so sourcing runs on its own.
    why_interesting: >
      It is a general event-and-action engine with years of accumulated integrations,
      which means almost any public page can become a signal source with no code.
    good_for:
      - Watchlist automation
      - Signal monitoring
      - Scheduled research
    limitations: >
      Dated interface, and the self-hosted install has real operational weight. Agents
      break quietly when a source page changes its markup.
    vc_native: false
    vc_relevance: adaptable
    ai: false
    self_hostable: true
    verification: true
    best_for: Watchlist automation

  - name: dgtlmoon/changedetection.io
    category: deal-sourcing
    tier: essential
    kind: software
    display_name: changedetection.io
    tagline: Tell me when a specific page changes.
    vc_use_case: >
      The narrow version of monitoring and the one analysts actually need: a competitor
      drops a price, adds a plan, edits a terms page, or a portfolio company quietly
      reshuffles its team page. This watches the page and says so.
    why_interesting: >
      It handles the parts that make naive diffing useless, including JavaScript-rendered
      pages and selecting only the region you care about, so it does not alert on a
      rotating banner.
    good_for:
      - Competitor monitoring
      - Portfolio monitoring
      - Regulatory tracking
    limitations: >
      Some features are behind a paid hosted tier, and a busy page still needs selector
      tuning. Notification plumbing is yours to set up.
    vc_native: false
    vc_relevance: adaptable
    ai: false
    self_hostable: true
    starter: true
    starter_order: 7
    hidden_gem: false
    verification: true
    best_for: Competitor monitoring

  - name: dubinc/dub
    category: deal-sourcing
    tier: recommended
    kind: software
    display_name: Dub
    tagline: Link attribution and inbound source tracking.
    vc_use_case: >
      A fund running a newsletter, a scout programme, or an event funnel wants to know
      which inbound deals came from where. Short links with attribution turn "we get
      deal flow" into a number per channel.
    why_interesting: >
      Attribution is normally the weak point in a fund's own funnel. Having it in an open
      tool means the pipeline can be read programmatically instead of trusted as folklore.
    good_for:
      - Inbound sourcing
      - Scout programmes
      - Channel attribution
    limitations: >
      The core is open source with a hosted commercial product on top, and some analytics
      features are paid. Self-hosting requires a database and infrastructure.
    vc_native: false
    vc_relevance: adaptable
    ai: false
    self_hostable: partial
    verification: true
    best_for: Inbound attribution

  # =========================================================================
  # Market & Industry Research
  # =========================================================================
  - name: assafelovic/gpt-researcher
    category: market-research
    tier: essential
    kind: software
    display_name: GPT Researcher
    tagline: An agent that researches a question across many sources and cites them.
    vc_use_case: >
      Hand it a market question, such as how many companies are selling continuous
      compliance tooling into European banks and who funded them, and it returns a
      written answer with the sources it used. This covers the desk research that
      otherwise eats an analyst's first two days on a new thesis.
    why_interesting: >
      It plans sub-questions and searches in parallel rather than issuing one query, and
      it keeps a source list attached to every claim. The citation trail is what makes it
      usable in a memo where someone will ask where a number came from.
    good_for:
      - Market research
      - Thesis building
      - Competitive research
    limitations: >
      Needs an LLM key and a search API, so cost scales with use. It can restate a weak
      source confidently, and every citation still needs opening.
    dependencies: Python 3.11+, OpenAI or another LLM provider, search API key
    vc_native: false
    vc_relevance: adaptable
    ai: true
    self_hostable: true
    starter: true
    starter_order: 8
    hidden_gem: false
    verification: true
    best_for: Market research

  - name: stanford-oval/storm
    category: market-research
    tier: essential
    kind: software
    display_name: STORM
    tagline: Writes a cited article from scratch on any topic.
    vc_use_case: >
      Ask it to produce a briefing on a sector and it researches, outlines, and drafts
      with references. Analysts use it for the market section of an investment memo, then
      edit down rather than start at a blank page.
    why_interesting: >
      It came out of Stanford's Oval lab and mimics how a reporter works: generate the
      questions a knowledgeable reader would ask, research each, then write. The
      question-generation step is what lifts it above summarize-the-top-ten-results.
    good_for:
      - Market research
      - Memo drafting
      - Sector briefings
    limitations: >
      Still needs an editor. It will produce fluent text about a market it has
      misunderstood, and the reference list occasionally includes sources it read thinly.
    vc_native: false
    vc_relevance: adaptable
    ai: true
    self_hostable: true
    starter: true
    starter_order: 9
    hidden_gem: false
    verification: true
    best_for: Memo drafting

  - name: Alibaba-NLP/DeepResearch
    category: market-research
    tier: recommended
    kind: research
    display_name: Tongyi DeepResearch
    tagline: An open deep-research agent with published weights.
    vc_use_case: >
      For funds that cannot send research questions to a hosted API, this runs research
      loops against a self-hosted model. Relevant when the question involves a target's
      confidential material or a sector you would rather not query through a vendor.
    why_interesting: >
      The model weights are open, which is rare for research agents, so the whole loop
      can run inside your own infrastructure. Its benchmark results are published with
      the code, so claims are checkable.
    good_for:
      - Confidential research
      - Self-hosted research
      - Model evaluation
    limitations: >
      Needs serious GPU capacity to run well. Setup is a research-engineering job, not an
      afternoon install.
    vc_native: false
    vc_relevance: adaptable
    ai: true
    self_hostable: true
    hidden_gem: false
    verification: true
    best_for: Self-hosted research

  - name: dzhng/deep-research
    category: market-research
    tier: recommended
    kind: software
    display_name: deep-research
    tagline: A small, readable iterative research loop.
    vc_use_case: >
      The version to read if you want to build your own research agent: it searches,
      reads, generates follow-up questions, and recurses to a depth you set. Funds
      building internal tooling use it as the reference implementation.
    why_interesting: >
      The whole thing is a few files. For understanding how deep research actually works,
      that beats reading a framework's documentation.
    good_for:
      - Internal tooling
      - Learning agent design
